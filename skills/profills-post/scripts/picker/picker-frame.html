<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Picker de posts — como vai aparecer no LinkedIn</title>

<script>
/* ══════════════════════════════════════════════════════════════════
   COMO PREENCHER — edite UMA linha só: a que está entre os marcadores
   "SUBSTITUA APENAS A LINHA ABAIXO" (≈linha 70), trocando EXEMPLO pelo
   objeto com os seus dados, no mesmo formato do EXEMPLO abaixo.

   O `EXEMPLO` logo abaixo é a referência de formato (e a demo que
   renderiza quando o arquivo é aberto sem edição) — não mexa nele;
   ele vira código morto quando DADOS é substituído. Todo o resto do
   arquivo é o motor de renderização e não deve ser editado.

   - `texto` é o post COMPLETO, num template literal (crases), com as
     quebras de linha reais. O corte "…mais" é calculado sozinho no
     ponto realista (~205 caracteres) — NÃO divida o texto na mão.
   - `[campos]` entre colchetes são realçados automaticamente.
   - 1 item em `opcoes` → preview final (com botão "Copiar o texto").
     2+ itens → comparador lado a lado, com Copiar em cada card.
   ══════════════════════════════════════════════════════════════════ */
const EXEMPLO = {
  kicker: "Opções · post de bastidor",
  titulo: "Escolha o ângulo — cada um como vai cair no feed",
  subtitulo: "Duas maneiras de contar a mesma coisa. Clique em \"…mais\" pra ver o post inteiro. Eu te pergunto no chat qual você quer levar.",

  empresa: {
    nome: "Sua Empresa",
    iniciais: "SE",
    descricao: "Fabricante de máquinas de embalagem",
    seguidores: "1.180 seguidores", // opcional — apague a linha se não souber
  },

  opcoes: [
    {
      angulo: "Orgulho de fundador",
      porque: "o mais fácil de soar autêntico", // só aparece no comparador
      foto: "foto da fábrica/equipe",           // null = post sem imagem
      fotoNota: "puxa mais que texto",
      texto: `Ontem mais uma máquina saiu da nossa fábrica. Fiquei parado no portão, olhando o caminhão até ele virar a esquina.

Parece bobagem. Mas toda vez é a mesma coisa.

Porque o que vai naquele caminhão não é só aço e motor.

São meses de projeto. O soldador que refez uma peça às 18h de uma sexta porque não ficou do jeito que queria.

O cliente vai ver uma máquina. A gente vê as [15] pessoas que colocaram a mão nela.

Qual foi a última coisa que a tua equipe fez que ninguém de fora vai perceber, mas fez toda a diferença?`,
    },
    {
      angulo: "Take contrário",
      porque: "gera debate nos comentários",
      foto: null,
      fotoNota: "",
      texto: `"Máquina boa é a que nunca dá problema." Depois de [X] anos fabricando, eu discordo.

Toda máquina, uma hora, vai precisar de atenção. Isso é física, não defeito.

A pergunta certa não é "vai dar problema?". É "quem vai estar do outro lado quando der?".

Máquina boa vem com gente atrás. Que atende, conhece o equipamento pelo número de série, resolve antes de virar prejuízo.

Você já ficou na mão de um fornecedor no pior momento? Como foi?`,
    },
  ],
};

/* ═════════ DADOS injetado pelo picker ═════════ */
<!-- CONTENT -->
/* ═══════════════ FIM DO BLOCO EDITÁVEL ═══════════════ */
</script>

<style>
  :root {
    color-scheme: light dark;
    --page: #ebedf0; --card: #ffffff; --ink: #1b1f23; --ink-2: #464e56; --muted: #6a7178;
    --line: #e2e5e8; --line-2: #d0d5da; --blue: #0a66c2; --sig: #d6531b; --sig-ink: #ad3f12;
    --ok: #1f8f5f; --fill-bg: #fbeee6; --fill-ink: #ad3f12;
    --sans: -apple-system, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --page: #14181c; --card: #1d2226; --ink: #e6e9ec; --ink-2: #b6bdc4; --muted: #8a929a;
      --line: #2b3339; --line-2: #38424a; --blue: #6cb0f0; --sig: #f2793b; --sig-ink: #f7986a;
      --ok: #3fc487; --fill-bg: #2c1a10; --fill-ink: #f7986a; }
  }
  :root[data-theme="light"]{ --page:#ebedf0;--card:#fff;--ink:#1b1f23;--ink-2:#464e56;--muted:#6a7178;--line:#e2e5e8;--line-2:#d0d5da;--blue:#0a66c2;--sig:#d6531b;--sig-ink:#ad3f12;--ok:#1f8f5f;--fill-bg:#fbeee6;--fill-ink:#ad3f12; }
  :root[data-theme="dark"]{ --page:#14181c;--card:#1d2226;--ink:#e6e9ec;--ink-2:#b6bdc4;--muted:#8a929a;--line:#2b3339;--line-2:#38424a;--blue:#6cb0f0;--sig:#f2793b;--sig-ink:#f7986a;--ok:#3fc487;--fill-bg:#2c1a10;--fill-ink:#f7986a; }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--sans);
    -webkit-font-smoothing: antialiased; padding: clamp(16px,3vw,32px) 16px 48px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .wrap.single { max-width: 560px; }

  .lead { text-align: center; margin-bottom: 24px; }
  .lead .k { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--sig-ink); }
  .lead h1 { font-size: clamp(20px,3.2vw,28px); font-weight: 700; margin: 9px 0 6px; letter-spacing: -.02em; text-wrap: balance; }
  .lead p { font-size: 14px; color: var(--muted); margin: 0 auto; max-width: 60ch; }
  .lead .fillnote { margin-top: 12px; font-size: 12.5px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 7px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 5px 13px; }
  .lead .fillnote mark { background: var(--fill-bg); color: var(--fill-ink); font-family: var(--mono); font-size: 11.5px; padding: 1px 6px; border-radius: 4px; font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(430px, 100%), 1fr)); gap: 20px; align-items: start; }
  .single .grid { grid-template-columns: 1fr; }

  .opt { display: flex; flex-direction: column; gap: 10px; }
  .opt > .lbl { display: flex; align-items: center; gap: 9px; padding: 0 2px; }
  .opt > .lbl .n { font-family: var(--mono); font-size: 12px; font-weight: 700; color: #fff; background: var(--sig); width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; flex: none; }
  .opt > .lbl b { font-size: 15px; font-weight: 680; letter-spacing: -.01em; }
  .opt > .lbl .why { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-left: auto; text-align: right; }

  .post { background: var(--card); border: 1px solid var(--line-2); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .phead { display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px 4px; }
  .avatar { width: 48px; height: 48px; border-radius: 8px; flex: none; background: linear-gradient(135deg, var(--sig), #7a2f10);
    color: #fff; display: grid; place-items: center; font-weight: 720; font-size: 18px; letter-spacing: .02em; }
  .who { flex: 1; min-width: 0; line-height: 1.3; }
  .who .nm { font-size: 15px; font-weight: 640; color: var(--ink); display: inline-flex; align-items: center; gap: 5px; }
  .who .nm svg { width: 14px; height: 14px; fill: var(--blue); }
  .who .sub { font-size: 12.5px; color: var(--muted); }
  .who .meta { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
  .who .meta svg { width: 12px; height: 12px; fill: var(--muted); }
  .follow { color: var(--blue); font-weight: 650; font-size: 14px; background: none; border: 0; cursor: default;
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 6px; font-family: var(--sans); }
  .follow svg { width: 15px; height: 15px; fill: var(--blue); }

  .ptext { padding: 4px 16px 8px; font-size: 14px; line-height: 1.5; color: var(--ink); white-space: pre-wrap; overflow-wrap: break-word; }
  .ptext .more { color: var(--muted); cursor: pointer; font-weight: 500; }
  .ptext .rest { display: none; }
  .ptext.open .rest { display: inline; }
  .ptext.open .more { display: none; }
  .ptext mark { background: var(--fill-bg); color: var(--fill-ink); font-family: var(--mono); font-size: 12.5px; padding: 0 5px; border-radius: 4px; font-weight: 600; }

  .fold { display: flex; align-items: center; gap: 10px; margin: 6px 16px 2px; font-family: var(--mono); font-size: 10.5px; color: var(--sig-ink); letter-spacing: .03em; }
  .fold::before, .fold::after { content: ""; flex: 1; height: 1px; background: repeating-linear-gradient(90deg, var(--sig) 0 4px, transparent 4px 8px); opacity: .5; }

  .photo { margin-top: 8px; background: var(--page); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); display: grid; place-items: center; padding: 14px; }
  .single .photo { aspect-ratio: 1.9/1; padding: 0; }
  .photo .box { border: 1.5px dashed var(--line-2); border-radius: 10px; padding: 12px 18px; font-size: 12.5px; color: var(--muted); text-align: center; max-width: 85%; }
  .photo .box b { color: var(--ink-2); display: block; margin-bottom: 2px; }

  .pstats { display: flex; justify-content: space-between; padding: 10px 16px 6px; font-size: 12.5px; color: var(--muted); }
  .pbar { display: flex; border-top: 1px solid var(--line); }
  .pbar .act { flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 4px;
    color: var(--muted); font-weight: 600; font-size: 13px; }
  .pbar .act svg { width: 17px; height: 17px; fill: var(--muted); }

  .hint { margin-top: 16px; background: var(--fill-bg); border: 1px solid color-mix(in srgb, var(--sig) 30%, transparent);
    border-radius: 10px; padding: 12px 15px; font-size: 13px; color: var(--ink-2); line-height: 1.5; }
  .hint b { color: var(--fill-ink); }

  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .copy { flex: 1; font-family: var(--sans); font-size: 14px; font-weight: 650; color: #fff; background: var(--sig); border: 0; border-radius: 9px; padding: 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s; }
  .copy:hover { background: var(--sig-ink); } .copy.done { background: var(--ok); }
  .copy svg { width: 15px; height: 15px; fill: currentColor; }

  .foot { text-align: center; margin-top: 24px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .foot b { color: var(--sig-ink); }
  :focus-visible { outline: 2px solid var(--sig); outline-offset: 2px; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function () {
  "use strict";
  if (typeof DADOS === "undefined") window.DADOS = EXEMPLO;

  var ICONS = {
    selo: '<svg viewBox="0 0 24 24"><path d="M12 2l2.4 2.1 3.1-.5 1.2 2.9 2.9 1.2-.5 3.1L23 12l-2.1 2.4.5 3.1-2.9 1.2-1.2 2.9-3.1-.5L12 22l-2.4-2.1-3.1.5-1.2-2.9L2.4 16l.5-3.1L1 12l2.1-2.4-.5-3.1 2.9-1.2L6.7 2.4l3.1.5L12 2zm-1.3 13.2l5.3-5.3-1.4-1.4-3.9 3.9-1.8-1.8-1.4 1.4 3.2 3.2z"/></svg>',
    globo: '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm6.9 6h-2.5a15.6 15.6 0 00-1.1-3.1A8 8 0 0118.9 8zM12 4c.7 1 1.3 2.4 1.6 4h-3.2c.3-1.6.9-3 1.6-4zM4.3 14a7.8 7.8 0 010-4h2.9a17 17 0 000 4H4.3zm.8 2h2.5c.3 1.1.7 2.2 1.1 3.1A8 8 0 015.1 16zm2.5-8H5.1a8 8 0 013.6-3.1C8.3 5.8 7.9 6.9 7.6 8zM12 20c-.7-1-1.3-2.4-1.6-4h3.2c-.3 1.6-.9 3-1.6 4zm2-6h-4a14 14 0 010-4h4a14 14 0 010 4zm.3 5.1c.4-.9.8-2 1.1-3.1h2.5a8 8 0 01-3.6 3.1zM16.8 14a17 17 0 000-4h2.9a7.8 7.8 0 010 4h-2.9z"/></svg>',
    mais: '<svg viewBox="0 0 24 24"><path d="M13 11V7h-2v4H7v2h4v4h2v-4h4v-2h-4z"/></svg>',
    gostei: '<svg viewBox="0 0 24 24"><path d="M2 21h2V9H2v12zm20-11c0-1.1-.9-2-2-2h-6.3l1-4.6v-.3c0-.4-.2-.8-.5-1.1L13.2 1 6.6 7.6c-.4.4-.6.9-.6 1.4v10c0 1.1.9 2 2 2h9c.8 0 1.5-.5 1.8-1.2l3-7c.1-.3.2-.5.2-.8v-2z"/></svg>',
    comentar: '<svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 00-2 2v12a2 2 0 002 2h4v4l4-4h8a2 2 0 002-2V4a2 2 0 00-2-2z"/></svg>',
    compartilhar: '<svg viewBox="0 0 24 24"><path d="M7 7h9v2.5l3.5-3.5L16 2.5V5H5v6h2V7zm10 10H8v-2.5L4.5 18 8 21.5V19h11v-6h-2v4z"/></svg>',
    enviar: '<svg viewBox="0 0 24 24"><path d="M3 4l18 8-18 8 4-8-4-8zm2.8 3l1.7 3.4h6l-6-3.4H5.8z"/></svg>',
    copiar: '<svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v12h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>',
  };

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // [campos] a preencher viram <mark> — os colchetes ficam visíveis de propósito
  function marcarCampos(s) {
    return esc(s).replace(/\[([^\][\n]{1,60})\]/g, "<mark>[$1]</mark>");
  }

  // O LinkedIn mostra ~200-210 caracteres (2-3 linhas) antes do "…mais".
  // Cortar só o gancho enganaria o usuário sobre o que aparece no feed.
  function pontoDeCorte(texto) {
    var LIMITE = 205;
    if (texto.length <= 215) return -1; // post curto: sem corte
    var trecho = texto.slice(0, LIMITE);
    var corte = Math.max(trecho.lastIndexOf(" "), trecho.lastIndexOf("\n"));
    if (corte < 60) corte = LIMITE; // sem espaço útil (improvável em pt): corta seco
    // não partir um [campo] ao meio
    var abre = texto.lastIndexOf("[", corte);
    if (abre > -1 && texto.indexOf("]", abre) > corte) corte = abre - 1;
    return corte;
  }

  function renderCabecalho(emp) {
    var sub = esc(emp.descricao || "");
    if (emp.seguidores) sub += (sub ? " · " : "") + esc(emp.seguidores);
    return (
      '<div class="phead">' +
        '<div class="avatar">' + esc(emp.iniciais || "?") + "</div>" +
        '<div class="who">' +
          '<div class="nm">' + esc(emp.nome || "Sua Empresa") + " " + ICONS.selo + "</div>" +
          '<div class="sub">' + sub + "</div>" +
          '<div class="meta">Agora · ' + ICONS.globo + "</div>" +
        "</div>" +
        '<button class="follow" type="button" aria-label="Seguir">' + ICONS.mais + "Seguir</button>" +
      "</div>"
    );
  }

  function renderTexto(texto) {
    var corte = pontoDeCorte(texto);
    if (corte === -1) return '<div class="ptext open">' + marcarCampos(texto) + "</div>";
    var visivel = texto.slice(0, corte);
    var resto = texto.slice(corte);
    return (
      '<div class="ptext">' + marcarCampos(visivel) +
        '<span class="more"> …mais</span>' +
        '<span class="rest">' + marcarCampos(resto) + "</span>" +
      "</div>"
    );
  }

  function renderFoto(op) {
    if (!op.foto) return "";
    var nota = op.fotoNota ? " " + esc(op.fotoNota) : "";
    return '<div class="photo"><div class="box"><b>' + esc(op.foto) + "</b>" + nota + "</div></div>";
  }

  function renderBarra(unico) {
    var stats = unico ? '<div class="pstats"><span>👍❤️ 0</span><span>0 comentários</span></div>' : "";
    return (
      stats +
      '<div class="pbar">' +
        '<span class="act">' + ICONS.gostei + "Gostei</span>" +
        '<span class="act">' + ICONS.comentar + "Comentar</span>" +
        '<span class="act">' + ICONS.compartilhar + "Compartilhar</span>" +
        (unico ? '<span class="act">' + ICONS.enviar + "Enviar</span>" : "") +
      "</div>"
    );
  }

  function renderPost(op, emp, unico) {
    return (
      '<div class="post">' +
        renderCabecalho(emp) +
        renderTexto(op.texto || "") +
        '<div class="fold">↑ o que aparece antes do clique</div>' +
        renderFoto(op) +
        renderBarra(unico) +
      "</div>"
    );
  }

  var unico = DADOS.opcoes.length === 1;
  var app = document.getElementById("app");
  if (unico) app.classList.add("single");
  if (DADOS.titulo) document.title = DADOS.titulo;

  var html =
    '<div class="lead">' +
      (DADOS.kicker ? '<div class="k">' + esc(DADOS.kicker) + "</div>" : "") +
      "<h1>" + esc(DADOS.titulo || "") + "</h1>" +
      (DADOS.subtitulo ? "<p>" + esc(DADOS.subtitulo) + "</p>" : "") +
      (!unico ? '<div class="fillnote">Os <mark>[campos]</mark> são pra você preencher com o teu real — eu faço isso com você depois de escolher.</div>' : "") +
    "</div>";

  var letras = "ABCDEFGHIJ";
  html += '<div class="grid">';
  (DADOS.opcoes || []).forEach(function (op, i) {
    var letra = letras.charAt(i) || String(i + 1);
    var copyBtn =
      '<div class="actions"><button class="copy" type="button" data-choice="' + letra + '" aria-label="Copiar rascunho ' + letra + '">' +
      ICONS.copiar + "Copiar " + letra + "</button></div>";
    if (unico) {
      html += '<div class="opt">' + renderPost(op, DADOS.empresa, true) + copyBtn + "</div>";
    } else {
      html +=
        '<div class="opt">' +
          '<div class="lbl"><span class="n">' + letra + "</span><b>" + esc(op.angulo || "") + "</b>" +
          (op.porque ? '<span class="why">' + esc(op.porque) + "</span>" : "") + "</div>" +
          renderPost(op, DADOS.empresa, false) +
          copyBtn +
        "</div>";
    }
  });
  html += "</div>";

  if (unico) {
    html +=
      '<div class="hint"><b>Repara na primeira linha:</b> é só ela e mais uma que aparecem no feed antes do "…mais". É o que decide se alguém para pra ler.</div>' +
      '<div class="foot">os <b>[campos]</b> em destaque a gente preenche juntos antes de publicar</div>';
  } else {
    html += '<div class="foot">clique em <b>"…mais"</b> pra abrir o post inteiro · copie no card que quiser levar</div>';
  }

  app.innerHTML = html;

  app.querySelectorAll(".ptext .more").forEach(function (m) {
    m.addEventListener("click", function () { m.closest(".ptext").classList.add("open"); });
  });

  app.querySelectorAll("button.copy").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var letra = btn.getAttribute("data-choice") || "A";
      var idx = letras.indexOf(letra);
      var texto = (DADOS.opcoes[idx] && DADOS.opcoes[idx].texto) || "";
      function marcar() {
        btn.classList.add("done");
        btn.innerHTML = ICONS.copiar + "Copiado";
        setTimeout(function () {
          btn.classList.remove("done");
          btn.innerHTML = ICONS.copiar + "Copiar " + letra;
        }, 1800);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).then(marcar).catch(marcar);
      } else {
        marcar();
      }
    });
  });
})();
</script>
</body>
</html>
